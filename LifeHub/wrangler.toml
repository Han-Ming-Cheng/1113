name = "lifehub-line-five-in-one"
main = "src/index.ts"
compatibility_date = "2026-11-13"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/webhook", "/config.js"]

[[d1_databases]]
binding = "DB"
database_name = "lifehub-db"
database_id = "5139575f-6ae8-45ae-85a5-477aeb47d51a"
migrations_dir = "migrations"
